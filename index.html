<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aaharithm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
  :root{
    --bg:#0f172a;--card:#111827;--muted:#94a3b8;--text:#e5e7eb;--primary:#22c55e;--accent:#38bdf8;--warn:#f59e0b;--danger:#ef4444;
    --border:#1f2937;--chip:#1f2937;--pill:#0b1220;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;background:linear-gradient(180deg,#0b1220,#0f172a);color:var(--text)}
  header{position:sticky;top:0;z-index:50;background:rgba(11,18,32,.8);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:10px 16px}
  header .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
  header .brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#10b981);display:grid;place-items:center;color:#0b1220;font-weight:900}
  header input[type="search"]{flex:1;max-width:560px;background:#0b1220;border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);outline:none}
  header .actions{margin-left:auto;display:flex;gap:8px}
  header .btn{background:var(--pill);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer}
  header .btn.primary{background:linear-gradient(135deg,var(--primary),#16a34a);border:none}

  .shell{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 56px)}
  aside{border-right:1px solid var(--border);padding:16px;background:#0b1220}
  aside .section-title{font-size:12px;color:var(--muted);text-transform:uppercase;margin:16px 12px 8px}
  .nav{display:flex;flex-direction:column;gap:6px}
  .nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--text);cursor:pointer;text-align:left}
  .nav button.active,.nav button:hover{background:var(--pill);border-color:var(--border)}
  .nav .emoji{width:22px}

  main{padding:18px}
  .grid{display:grid;gap:16px}
  .grid.cols-2{grid-template-columns:1fr 1fr}
  .grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .grid.cols-4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1100px){.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr}}
  @media(max-width:800px){.shell{grid-template-columns:1fr}aside{position:sticky;top:56px;z-index:20}}

  .card{background:linear-gradient(180deg,#0e1528, #0c1424);border:1px solid var(--border);border-radius:14px;padding:14px}
  .card h3{margin:0 0 8px;font-size:16px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:999px;font-size:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--pill);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#0891b2);border:none}
  .btn.success{background:linear-gradient(135deg,var(--primary),#16a34a);border:none}
  .btn.warn{background:linear-gradient(135deg,var(--warn),#d97706);border:none}
  .btn.danger{background:linear-gradient(135deg,var(--danger),#dc2626);border:none}
  .btn.ghost{background:transparent;border:1px dashed var(--border)}
  .btn.small{padding:6px 8px;font-size:12px}
  .btn.block{display:block;width:100%}

  .table{width:100%;border-collapse:collapse}
  .table th,.table td{border-bottom:1px solid var(--border);padding:10px;text-align:left;font-size:14px}
  .table th{color:var(--muted);font-weight:600}
  .table tr:hover{background:#0b1220}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field select,.field textarea{background:#0b1220;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;outline:none}
  .field textarea{min-height:80px}

  .tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tabbar .tab{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--pill);cursor:pointer}
  .tabbar .tab.active{background:linear-gradient(135deg,#1f2937,#0b1220)}

  .kpi{display:flex;align-items:center;justify-content:space-between}
  .kpi .big{font-size:24px;font-weight:700}
  .kpi .label{color:var(--muted);font-size:12px}

  .badge{padding:3px 8px;border-radius:999px;font-size:12px;border:1px solid var(--border);background:var(--chip)}
  .status-upcoming{color:#22c55e}.status-completed{color:#38bdf8}.status-cancelled{color:#ef4444}

  .chat{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto;padding:8px;border:1px solid var(--border);border-radius:12px;background:#0b1220}
  .msg{display:flex;gap:8px;align-items:flex-start}
  .msg .bubble{padding:10px 12px;border-radius:12px;border:1px solid var(--border);max-width:740px}
  .msg.user .bubble{background:#0a1a31}
  .msg.bot .bubble{background:#0f1f38}
  .chatbar{display:flex;gap:8px;margin-top:8px}
  .chatbar input{flex:1}
  .code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;background:#0b1220;border:1px dashed var(--border);padding:8px;border-radius:8px}

  .hr{border-bottom:1px dashed var(--border);margin:10px 0}
  .right{margin-left:auto}
  .center{display:grid;place-items:center}
  .hidden{display:none!important}

  /* ========== Responsive Enhancements (tablet & mobile) ========== */

  /* Tablet: narrower search, slightly smaller spacing */
  @media (max-width:1100px) and (min-width:801px) {
    header input[type="search"]{max-width:360px}
    .shell{grid-template-columns:220px 1fr}
    aside{padding:12px}
    main{padding:14px}
    .card{padding:12px}
    .grid.cols-3{grid-template-columns:1fr 1fr}
  }

  /* Mobile: stack layout, compact controls, horizontal nav in aside */
  @media (max-width:800px) {
    header{padding:8px 12px;gap:8px}
    header .brand{font-size:16px}
    header .brand .logo{width:24px;height:24px;border-radius:6px}
    /* make search flow under brand and actions on small screens */
    header{flex-wrap:wrap}
    header input[type="search"]{order:3;flex-basis:100%;max-width:none;margin-top:8px}
    header .actions{order:2;margin-left:0;gap:6px;flex-wrap:wrap;width:100%;justify-content:flex-end}
    header .actions .btn, header .actions label.btn{padding:6px 8px;font-size:13px}

    /* single-column app shell */
    .shell{grid-template-columns:1fr}
    aside{
      position:sticky;top:56px;z-index:30;
      border-right:none;border-bottom:1px solid var(--border);
      padding:10px;display:flex;align-items:center;gap:8px;overflow:auto;background:#071124;
    }
    aside .section-title{display:none} /* reduce duplication on mobile */
    .nav{flex-direction:row;gap:8px}
    .nav button{white-space:nowrap;padding:8px;border-radius:10px;min-height:40px}
    .nav button .emoji{display:inline-block}

    /* content adjustments */
    main{padding:12px}
    .card{padding:12px;border-radius:12px}
    .grid.cols-3,.grid.cols-4{grid-template-columns:1fr}
    .grid.cols-2{grid-template-columns:1fr}
    .grid.cols-6{grid-template-columns:repeat(2,1fr)}
    .grid.cols-5{grid-template-columns:repeat(2,1fr)}
    .grid.cols-4{grid-template-columns:repeat(2,1fr)}

    /* chat and tables */
    .chat{max-height:260px}
    .tabbar{overflow:auto}
    .table{display:block;width:100%;overflow:auto}
    .table th,.table td{white-space:nowrap;padding:8px;font-size:13px}
    .field input,.field select,.field textarea{padding:8px}
    .btn.small{padding:6px 8px;font-size:12px}

    /* reduce text wrap on pills/badges */
    .pill, .badge{font-size:11px;padding:4px 6px}
  }

  /* Very small phones - additional compacting */
  @media (max-width:420px){
    header .brand{font-size:15px}
    header .btn, .btn{padding:6px 8px;font-size:13px}
    .card h3{font-size:15px}
    .kpi .big{font-size:20px}
    .chat .bubble{font-size:14px}
  }

  /* Ensure tables and code blocks can scroll horizontally on any narrow viewport */
  .table, .code{overflow-x:auto}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">A++</div>
    Aaharithm
  </div>
  <input id="globalSearch" type="search" placeholder="Search patients by name, phone, ID..." />
  <div class="actions">
    <button class="btn" id="exportBtn">Export JSON</button>
    <label class="btn">
      Import JSON
      <input id="importFile" type="file" accept=".json" style="display:none" />
    </label>
    <button class="btn primary" id="newPatientBtn">+ New Patient</button>
  </div>
</header>

<div class="shell">
  <aside>
    <div class="section-title">Navigation</div>
    <div class="nav">
      <button data-route="dashboard" class="active"><span class="emoji">🏠</span>Dashboard</button>
      <button data-route="patients"><span class="emoji">👥</span>Patients</button>
      <button data-route="new"><span class="emoji">➕</span>New Patient</button>
      <button data-route="diet"><span class="emoji">🥗</span>Diet Coach</button>
      <button data-route="about"><span class="emoji">ℹ️</span>About</button>
    </div>
    <div class="section-title">Selected Patient</div>
    <div id="sidebarPatient" class="card">
      <div class="muted">No patient selected</div>
    </div>
  </aside>

  <main id="view">
    <!-- Dynamic content renders here -->
  </main>
</div>

<script>
/* ========== Simple Frontend Data Layer (LocalStorage) ========== */
const LS_KEY = 'health360_pms';
function uid(){return 'id_' + Math.random().toString(36).slice(2,10)}
function load(){
  const raw = localStorage.getItem(LS_KEY);
  if(!raw){ const data = seed(); save(data); return data; }
  try{ return JSON.parse(raw) }catch(e){ return seed() }
}
function save(data){ localStorage.setItem(LS_KEY, JSON.stringify(data)) }
function seed(){
  const now = new Date();
  const p1 = {
    id: uid(), firstName:'John', lastName:'Doe', gender:'male', dob:'1980-06-15',
    email:'john@example.com', phone:'+1 555-0101',
    address:'123 Main St, Springfield', bloodType:'O+', heightCm:178, weightKg:85,
    insurance:{payer:'Acme Health', plan:'Gold PPO', memberId:'ACM12345'},
    balance: 120.50,
    emergency:{name:'Jane Doe', phone:'+1 555-0202', relation:'Spouse'},
    allergies:[{substance:'Penicillin', reaction:'Rash', severity:'moderate'}],
    conditions:[{name:'Type 2 Diabetes', status:'active'},{name:'Hypertension', status:'active'}],
    meds:[{name:'Metformin', dose:'500 mg', freq:'BID', start:'2023-01-15', status:'active'}],
    immunizations:[{vaccine:'Influenza', date:'2024-11-01'}],
    vitals:[{date:fmtDate(now,-30), bp:'130/80', hr:76, temp:36.8, spo2:98, weightKg:85, heightCm:178},
            {date:fmtDate(now,-1), bp:'128/78', hr:74, temp:36.7, spo2:98, weightKg:84.5, heightCm:178}],
    labs:[{date:'2025-05-12', test:'HbA1c', value:6.8, unit:'%', ref:'<5.7%'},
          {date:'2025-05-12', test:'LDL-C', value:112, unit:'mg/dL', ref:'<100 mg/dL'}],
    lifestyle:{dietPreference:'vegetarian', activity:'moderate', smoking:'never', alcohol:'occasionally', sleepHours:7, hydration:'2L/day'},
    appointments:[{id:uid(), date:fmtDate(now,3)+'T10:00', reason:'Routine follow-up', provider:'Dr. Lee', location:'Clinic A', status:'upcoming'}],
    documents:[{title:'Last Discharge Summary', url:'#', date:'2024-10-02'}],
    notes:[{date:'2025-06-01', text:'Advised SMBG twice daily. Emphasized DASH-style diet.'}],
    careTeam:[{name:'Dr. Lee', role:'Primary Care', phone:'555-0303'}],
  };
  const p2 = {
    id: uid(), firstName:'Aisha', lastName:'Khan', gender:'female', dob:'1993-04-02',
    email:'aisha@example.com', phone:'+44 7700 900123',
    address:'221B Baker St, London', bloodType:'A+', heightCm:162, weightKg:60,
    insurance:{payer:'NHS', plan:'Standard', memberId:'NHS-7788'},
    balance: 0,
    emergency:{name:'Sara Khan', phone:'+44 7700 900456', relation:'Sister'},
    allergies:[{substance:'Lactose', reaction:'GI upset', severity:'mild'}],
    conditions:[{name:'Iron-deficiency anemia', status:'active'}],
    meds:[{name:'Ferrous sulfate', dose:'325 mg', freq:'Daily', start:'2025-01-10', status:'active'}],
    immunizations:[{vaccine:'Tdap', date:'2023-02-14'}],
    vitals:[{date:'2025-05-01', bp:'112/70', hr:68, temp:36.6, spo2:99, weightKg:60, heightCm:162}],
    labs:[{date:'2025-05-06', test:'Hemoglobin', value:10.8, unit:'g/dL', ref:'12-16 g/dL'}],
    lifestyle:{dietPreference:'lacto-vegetarian', activity:'light', smoking:'never', alcohol:'never', sleepHours:8, hydration:'2.2L/day'},
    appointments:[{id:uid(), date:fmtDate(now,10)+'T14:00', reason:'Nutrition consult', provider:'RD Gomez', location:'Clinic B', status:'upcoming'}],
    documents:[], notes:[], careTeam:[{name:'RD Gomez', role:'Dietitian', phone:'555-0808'}],
  };
  return { patients:[p1,p2], selectedId:null }
}
function fmtDate(base, offsetDays=0){
  const d = new Date(base);
  d.setDate(d.getDate()+offsetDays);
  return d.toISOString().slice(0,10);
}
let state = load();

/* ========== Router ========== */
const view = document.getElementById('view');
const routes = {
  dashboard: renderDashboard,
  patients: renderPatients,
  new: renderNewPatient,
  diet: renderGlobalDietCoach,
  about: renderAbout
}
let currentRoute = 'dashboard';
function navigate(route, params={}){
  currentRoute = route;
  document.querySelectorAll('aside .nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.route===route)
  });
  view.innerHTML = '';
  routes[route](params);
}
document.querySelectorAll('aside .nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>navigate(btn.dataset.route))
});
document.getElementById('newPatientBtn').addEventListener('click', ()=>navigate('new'));

/* ========== Utilities ========== */
function setSelected(id){
  state.selectedId = id; save(state); renderSidebarPatient();
}
function getSelected(){ return state.patients.find(p=>p.id===state.selectedId) || null }
function ageFromDob(dob){
  if(!dob) return null;
  const d=new Date(dob); const diff=Date.now()-d.getTime(); const a=new Date(diff); return Math.abs(a.getUTCFullYear()-1970);
}
function bmiCalc(w,h){ if(!w||!h) return null; const m=h/100; return (w/(m*m)).toFixed(1) }
function cap(s){ return (s||'').charAt(0).toUpperCase()+ (s||'').slice(1) }

/* ========== Sidebar Selected Patient ========== */
function renderSidebarPatient(){
  const el = document.getElementById('sidebarPatient');
  const p = getSelected();
  if(!p){ el.innerHTML = '<div class="muted">No patient selected</div>'; return }
  const age = ageFromDob(p.dob);
  const bmi = bmiCalc(p.weightKg,p.heightCm);
  el.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <div>
        <div style="font-weight:700">${p.firstName} ${p.lastName}</div>
        <div class="muted">${cap(p.gender)} • ${age}y</div>
      </div>
      <button class="btn small" id="open360">Open 360°</button>
    </div>
    <div class="hr"></div>
    <div class="row"><span class="pill">HT: ${p.heightCm||'—'} cm</span><span class="pill">WT: ${p.weightKg||'—'} kg</span><span class="pill">BMI: ${bmi||'—'}</span></div>
    <div style="margin-top:8px" class="muted">Conditions:</div>
    <div class="row">${(p.conditions||[]).slice(0,5).map(c=>`<span class="badge">${c.name}</span>`).join('') || '<span class="muted">None</span>'}</div>
  `;
  el.querySelector('#open360').addEventListener('click', ()=>{
    navigate('patients');
    setTimeout(()=> openPatientProfile(p.id), 0);
  })
}

/* ========== Dashboard ========== */
function renderDashboard(){
  const today = new Date().toISOString().slice(0,10);
  const totalPatients = state.patients.length;
  const upcoming = state.patients.flatMap(p=>p.appointments||[]).filter(a=>a.status==='upcoming').length;
  const todayAppts = state.patients.flatMap(p=>p.appointments||[]).filter(a=> (a.date||'').slice(0,10)===today).length;

  const shell = document.createElement('div');
  shell.className = 'grid cols-3';

  shell.innerHTML = `
    <div class="card kpi"><div><div class="big">${totalPatients}</div><div class="label">Total Patients</div></div><div>👥</div></div>
    <div class="card kpi"><div><div class="big">${upcoming}</div><div class="label">Upcoming Appointments</div></div><div>📅</div></div>
    <div class="card kpi"><div><div class="big">${todayAppts}</div><div class="label">Today</div></div><div>🕒</div></div>
  `;
  const second = document.createElement('div');
  second.className = 'grid cols-2';
  second.innerHTML = `
    <div class="card">
      <h3>Recent Patients</h3>
      <table class="table">
        <thead><tr><th>Name</th><th>Age</th><th>Phone</th><th></th></tr></thead>
        <tbody>
          ${state.patients.slice(-5).map(p=>`
            <tr>
              <td>${p.firstName} ${p.lastName}</td>
              <td>${ageFromDob(p.dob)||'—'}</td>
              <td>${p.phone||'—'}</td>
              <td><button class="btn small" data-open="${p.id}">Open</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div class="card">
      <h3>Quick Actions</h3>
      <div class="row">
        <button class="btn" onclick="navigate('new')">➕ Add Patient</button>
        <button class="btn" onclick="navigate('patients')">👥 View Patients</button>
        <button class="btn" onclick="navigate('diet')">🥗 Diet Coach</button>
      </div>
      <div class="hr"></div>
      <div class="muted">Tip: Use Export/Import (top-right) to move demo data between browsers.</div>
    </div>
  `;
  view.appendChild(shell);
  view.appendChild(second);
  view.querySelectorAll('[data-open]').forEach(b=>{
    b.addEventListener('click', ()=>{ setSelected(b.dataset.open); navigate('patients'); setTimeout(()=>openPatientProfile(b.dataset.open),0); })
  })
}

/* ========== Patients List & 360° Profile ========== */
function renderPatients(){
  const container = document.createElement('div');
  container.className = 'grid cols-1';

  const tableCard = document.createElement('div');
  tableCard.className = 'card';
  tableCard.innerHTML = `
    <div class="row" style="justify-content:space-between;">
      <h3>Patients</h3>
      <div class="row">
        <input id="patientSearch" class="field" placeholder="Search name/phone..." style="min-width:240px" />
        <button class="btn" onclick="navigate('new')">+ New</button>
      </div>
    </div>
    <table class="table">
      <thead><tr><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Conditions</th><th>Balance</th><th></th></tr></thead>
      <tbody id="patientsTbody"></tbody>
    </table>
  `;
  container.appendChild(tableCard);

  const profileCard = document.createElement('div');
  profileCard.className = 'card hidden';
  profileCard.id = 'profileCard';
  container.appendChild(profileCard);

  view.appendChild(container);

  const tbody = tableCard.querySelector('#patientsTbody');
  const searchInput = tableCard.querySelector('#patientSearch');
  function renderList(){
    const q = (searchInput.value||'').toLowerCase().trim();
    const items = state.patients.filter(p=>{
      const s = [p.firstName,p.lastName,p.phone,(p.id||'')].join(' ').toLowerCase();
      return s.includes(q)
    });
    tbody.innerHTML = items.map(p=>{
      return `<tr>
        <td>${p.firstName} ${p.lastName}</td>
        <td>${ageFromDob(p.dob)||'—'}</td>
        <td>${cap(p.gender||'—')}</td>
        <td>${p.phone||'—'}</td>
        <td>${(p.conditions||[]).map(c=>c.name).slice(0,3).join(', ')||'—'}</td>
        <td>$${(p.balance||0).toFixed(2)}</td>
        <td><button class="btn small" data-open="${p.id}">Open 360°</button></td>
      </tr>`
    }).join('');
    tbody.querySelectorAll('[data-open]').forEach(b=>{
      b.addEventListener('click', ()=> openPatientProfile(b.dataset.open))
    });
  }
  renderList();
  searchInput.addEventListener('input', renderList);

  // If already selected, open directly
  if(state.selectedId){ openPatientProfile(state.selectedId) }
}

function openPatientProfile(id){
  const p = state.patients.find(x=>x.id===id);
  if(!p) return;
  setSelected(id);
  const profileCard = document.getElementById('profileCard');
  profileCard.classList.remove('hidden');
  const age = ageFromDob(p.dob);
  const bmi = bmiCalc(p.weightKg,p.heightCm);

  // Tabs
  const tabs = ['Overview','Demographics','Conditions','Allergies','Medications','Vitals','Labs','Immunizations','Lifestyle','Appointments','Documents','Notes','Care Team','Insurance & Billing','Diet Coach'];
  let activeTab = 'Overview';

  function renderTab(){
    profileCard.innerHTML = `
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <h3>${p.firstName} ${p.lastName} <span class="muted">(${cap(p.gender)} • ${age}y)</span></h3>
          <div class="row">
            <span class="pill">Height: ${p.heightCm||'—'} cm</span>
            <span class="pill">Weight: ${p.weightKg||'—'} kg</span>
            <span class="pill">BMI: ${bmi||'—'}</span>
            <span class="pill">Blood: ${p.bloodType||'—'}</span>
          </div>
        </div>
        <div class="row">
          <button class="btn small" id="deletePatient" title="Delete patient">🗑️</button>
        </div>
      </div>

      <div class="tabbar">${tabs.map(t=>`<div class="tab ${t===activeTab?'active':''}" data-tab="${t}">${t}</div>`).join('')}</div>
      <div id="tabContent"></div>
    `;
    profileCard.querySelectorAll('.tab').forEach(tb=> tb.addEventListener('click', ()=>{ activeTab = tb.dataset.tab; renderTab() }));
    profileCard.querySelector('#deletePatient').addEventListener('click', ()=>{
      if(confirm('Delete this patient?')){ state.patients = state.patients.filter(x=>x.id!==p.id); save(state); navigate('patients'); renderSidebarPatient(); }
    });

    const c = profileCard.querySelector('#tabContent');
    switch(activeTab){
      case 'Overview': return renderOverview(c,p);
      case 'Demographics': return renderDemographics(c,p);
      case 'Conditions': return renderConditions(c,p);
      case 'Allergies': return renderAllergies(c,p);

      case 'Lifestyle': return renderLifestyle(c,p);

      case 'Documents': return renderDocuments(c,p);
      case 'Notes': return renderNotes(c,p);
      case 'Care Team': return renderCareTeam(c,p);
      case 'Insurance & Billing': return renderInsurance(c,p);
      case 'Diet Coach': return renderDietCoach(c,p);

    <h3>Care Team</h3>
    <table class="table">
      <thead><tr><th>Name</th><th>Role</th><th>Phone</th><th></th></tr></thead>
      <tbody id="ctRows"></tbody>
    </table>
    <div class="hr"></div>
    <div class="grid cols-3">
      <div class="field"><label>Name</label><input id="ctname"></div>
      <div class="field"><label>Role</label><input id="ctrole" placeholder="Primary Care, Cardiologist, RD..."></div>
      <div class="field"><label>Phone</label><input id="ctphone"></div>
    </div>
    <button class="btn success" id="addCt">Add Member</button>
  `;
  function draw(){
    const rows = c.querySelector('#ctRows');
    rows.innerHTML = (p.careTeam||[]).map((m,i)=>`
      <tr><td>${m.name}</td><td>${m.role||'—'}</td><td>${m.phone||'—'}</td>
      <td><button class="btn small" data-del="${i}">Delete</button></td></tr>
    `).join('')||'<tr><td colspan="4" class="muted">No care team</td></tr>';
    rows.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{ p.careTeam.splice(+b.dataset.del,1); save(state); draw() }));
  }
  draw();
  c.querySelector('#addCt').addEventListener('click',()=>{
    p.careTeam=p.careTeam||[];
    const name=c.querySelector('#ctname').value.trim(); if(!name) return;
    p.careTeam.push({name, role:c.querySelector('#ctrole').value.trim(), phone:c.querySelector('#ctphone').value.trim()});
    save(state); renderCareTeam(c,p);
  })
}

/* ========== Diet Coach (Chatbot) ========== */
function renderDietCoach(c,p){
  c.innerHTML = `
    <div class="grid cols-2">
      <div>
        <h3>Diet Coach for ${p.firstName}</h3>
        <div class="chat" id="chat"></div>
        <div class="chatbar">
          <input id="chatInput" placeholder="Tell me your preferences (e.g., I’m vegetarian, lactose-free, want to lose weight)"/>
          <button class="btn" id="sendMsg">Send</button>
          <button class="btn success" id="useProfile">Use Profile</button>
        </div>
        <div class="muted" style="margin-top:6px">This is an educational prototype, not medical advice.</div>
      </div>
      <div>
        <h3>Preferences & Targets</h3>
        <div class="grid cols-2">
          <div class="field"><label>Goal</label>
            <select id="goal"><option>maintain</option><option>weight loss</option><option>weight gain</option><option>muscle gain</option><option>blood sugar control</option><option>heart health</option><option>kidney friendly</option></select>
          </div>
          <div class="field"><label>Diet</label>
            <select id="diet">
              ${['none','vegetarian','vegan','lacto-vegetarian','ovo-vegetarian','pescatarian','halal','kosher','gluten-free','lactose-free','low-carb','Mediterranean','DASH'].map(x=>`<option>${x}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Restrictions (comma)</label><input id="restr" placeholder="nuts, shellfish, pork"></div>
          <div class="field"><label>Activity</label><select id="activity2"><option>sedentary</option><option>light</option><option>moderate</option><option>active</option><option>very active</option></select></div>
          <div class="field"><label>Sex</label><select id="sex"><option>male</option><option>female</option></select></div>
          <div class="field"><label>Age</label><input id="age" type="number" value="${ageFromDob(p.dob)||''}"></div>
          <div class="field"><label>Height (cm)</label><input id="h2" type="number" value="${p.heightCm||''}"></div>
          <div class="field"><label>Weight (kg)</label><input id="w2" type="number" value="${p.weightKg||''}"></div>
        </div>
        <button class="btn primary" id="genPlan">Generate Diet Plan</button>
        <div class="hr"></div>
        <div id="planOut"></div>
      </div>
    </div>
  `;
  const chat = c.querySelector('#chat');
  function pushBot(text){ addMsg('bot', text) }
  function pushUser(text){ addMsg('user', text) }
  function addMsg(who,text){
    const div = document.createElement('div');
    div.className = 'msg '+who;
    div.innerHTML = `<div class="bubble">${nl2br(escapeHtml(text))}</div>`;
    chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  }
  pushBot(`Hi ${p.firstName}! I can tailor a meal plan using your profile or your preferences. Try: "I’m vegan, want weight loss, low sodium." Or click "Use Profile".`);

  c.querySelector('#sendMsg').addEventListener('click',()=>{
    const msg = c.querySelector('#chatInput').value.trim(); if(!msg) return;
    c.querySelector('#chatInput').value='';
    pushUser(msg);
    const parsed = parsePrefs(msg);
    pushBot('Got it! Preferences detected: '+ JSON.stringify(parsed, null, 2));
    fillPrefs(parsed);
    const plan = buildDietPlan({...collectPrefs(), name:p.firstName});
    renderPlan(c.querySelector('#planOut'), plan);
    pushBot('Generated a plan below based on your message. You can tweak fields on the right and Regenerate.');
  });

  c.querySelector('#useProfile').addEventListener('click',()=>{
    const prof = {
      goal: inferGoalFromConditions(p),
      diet: p.lifestyle?.dietPreference || 'none',
      restrictions: (p.allergies||[]).map(a=>a.substance.toLowerCase()),
      activity: p.lifestyle?.activity || 'light',
      sex: p.gender || 'male',
      age: ageFromDob(p.dob)||30,
      heightCm: p.heightCm||170,
      weightKg: p.weightKg||70,
      conditions: (p.conditions||[]).map(c=>c.name.toLowerCase())
    };
    fillPrefs(prof);
    pushBot('Using your profile to generate a plan…');
    const plan = buildDietPlan({...collectPrefs(), name:p.firstName});
    renderPlan(c.querySelector('#planOut'), plan);
  });

  c.querySelector('#genPlan').addEventListener('click',()=>{
    const plan = buildDietPlan({...collectPrefs(), name:p.firstName});
    renderPlan(c.querySelector('#planOut'), plan);
  });

  function collectPrefs(){
    return {
      goal: c.querySelector('#goal').value,
      diet: c.querySelector('#diet').value,
      restrictions: (c.querySelector('#restr').value||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),
      activity: c.querySelector('#activity2').value,
      sex: c.querySelector('#sex').value,
      age: +c.querySelector('#age').value||30,
      heightCm: +c.querySelector('#h2').value||170,
      weightKg: +c.querySelector('#w2').value||70,
      conditions: (p.conditions||[]).map(c=>c.name.toLowerCase())
    }
  }
  function fillPrefs(obj){
    if(obj.goal) c.querySelector('#goal').value = obj.goal;
    if(obj.diet) c.querySelector('#diet').value = obj.diet;
    if(obj.restrictions) c.querySelector('#restr').value = (obj.restrictions||[]).join(', ');
    if(obj.activity) c.querySelector('#activity2').value = obj.activity;
    if(obj.sex) c.querySelector('#sex').value = obj.sex;
    if(obj.age) c.querySelector('#age').value = obj.age;
    if(obj.heightCm) c.querySelector('#h2').value = obj.heightCm;
    if(obj.weightKg) c.querySelector('#w2').value = obj.weightKg;
  }
}

/* ========== Diet Logic ========== */
function parsePrefs(text){
  const t = text.toLowerCase();
  const obj = {};
  // diet
  const dietMap = ['vegan','vegetarian','lacto-vegetarian','ovo-vegetarian','pescatarian','halal','kosher','gluten-free','lactose-free','low-carb','mediterranean','dash'];
  for(const d of dietMap){ if(t.includes(d)) obj.diet = d; }
  // goals
  if(/lose|weight loss|fat loss/.test(t)) obj.goal='weight loss';
  else if(/gain|bulk|weight gain/.test(t)) obj.goal='weight gain';
  else if(/muscle/.test(t)) obj.goal='muscle gain';
  else if(/sugar|diabet/.test(t)) obj.goal='blood sugar control';
  else if(/heart|cholesterol/.test(t)) obj.goal='heart health';
  else if(/kidney|ckd/.test(t)) obj.goal='kidney friendly';
  // activity
  if(/sedentary/.test(t)) obj.activity='sedentary';
  else if(/light/.test(t)) obj.activity='light';
  else if(/moderate/.test(t)) obj.activity='moderate';
  else if(/active|very active/.test(t)) obj.activity='active';
  // sex + age like "35f" "29 m"
  const sex = t.match(/(\d{2})\s*([mf])\b/); if(sex){ obj.age=+sex[1]; obj.sex= sex[2]==='m'?'male':'female' }
  if(/male/.test(t)) obj.sex='male'; if(/female|woman|girl/.test(t)) obj.sex='female';
  // height/weight
  const kg = t.match(/(\d{2,3})\s*kg/); if(kg) obj.weightKg=+kg[1];
  const cm = t.match(/(\d{2,3})\s*cm/); if(cm) obj.heightCm=+cm[1];
  // restrictions
  const restrict = [];
  if(/lactose|dairy/.test(t)) restrict.push('lactose');
  if(/gluten/.test(t)) restrict.push('gluten');
  if(/nut|peanut/.test(t)) restrict.push('nuts');
  if(/shellfish/.test(t)) restrict.push('shellfish');
  if(/egg/.test(t)) restrict.push('egg');
  if(/pork/.test(t)) restrict.push('pork');
  obj.restrictions = restrict;
  return obj;
}
function inferGoalFromConditions(p){
  const names = (p.conditions||[]).map(c=>c.name.toLowerCase());
  if(names.some(s=>s.includes('diabetes'))) return 'blood sugar control';
  if(names.some(s=>s.includes('hypertension'))) return 'heart health';
  return 'maintain';
}
function activityFactor(a){
  return {sedentary:1.2, light:1.375, moderate:1.55, active:1.725, 'very active':1.9}[a||'light'] || 1.375
}
function calcBMR({sex='male', weightKg=70, heightCm=170, age=30}={}){
  return Math.round(10*weightKg + 6.25*heightCm - 5*age + (sex==='male'?5:-161));
}
function targetCalories(bmr, goal){
  let cal = Math.round(bmr*1); // baseline before activity
  // activity applied outside
  if(goal==='weight loss') cal -= 500;
  if(goal==='weight gain' || goal==='muscle gain') cal += 300;
  return Math.max(1200, cal);
}
function macroPlan(cal, context){
  const conds = (context.conditions||[]).map(s=>s.toLowerCase());
  let carbPct=0.45, protPct=0.30, fatPct=0.25;
  if(conds.some(x=>x.includes('diab'))) { carbPct=0.35; protPct=0.30; fatPct=0.35; }
  if(conds.some(x=>x.includes('hypert')||x.includes('heart'))) { carbPct=0.45; protPct=0.25; fatPct=0.30; }
  if(conds.some(x=>x.includes('kidney')||x.includes('ckd'))) {
    const gramsProtein = Math.max(0.8 * (context.weightKg||70), 45);
    return {
      calories: cal, proteinG: Math.round(gramsProtein), carbsG: Math.round((cal*0.50)/4), fatG: Math.round((cal*0.30)/9),
      note: 'CKD-friendly: moderate protein ~0.8 g/kg, monitor K/Phos with clinician.'
    }
  }
  const proteinG = Math.round((cal*protPct)/4);
  const carbsG = Math.round((cal*carbPct)/4);
  const fatG = Math.round((cal*fatPct)/9);
  return {calories:cal, proteinG, carbsG, fatG};
}
function foodBank(){
  return {
    proteins:[
      {n:'chicken breast', tags:['meat']},
      {n:'salmon', tags:['fish']},
      {n:'eggs', tags:['egg']},
      {n:'tofu', tags:['vegan','veg']},
      {n:'tempeh', tags:['vegan','veg']},
      {n:'lentils', tags:['vegan','veg']},
      {n:'chickpeas', tags:['vegan','veg']},
      {n:'greek yogurt', tags:['dairy']},
      {n:'paneer', tags:['dairy']},
      {n:'turkey', tags:['meat']},
      {n:'tuna', tags:['fish']},
    ],
    carbs:[
      {n:'oats', gi:'low', tags:['gluten']},
      {n:'quinoa', gi:'low', tags:['gf']},
      {n:'brown rice', gi:'medium', tags:['gf']},
      {n:'sweet potato', gi:'medium', tags:['gf']},
      {n:'whole wheat bread', gi:'high', tags:['gluten']},
      {n:'legumes', gi:'low', tags:['gf']},
      {n:'buckwheat', gi:'low', tags:['gf']}
    ],
    fats:[
      {n:'olive oil'},{n:'avocado'},{n:'almonds', tags:['nuts']},{n:'walnuts', tags:['nuts']},{n:'chia seeds'},{n:'peanut butter', tags:['nuts']}
    ],
    veggies:[
      {n:'spinach'},{n:'broccoli'},{n:'bell peppers'},{n:'carrots'},{n:'cauliflower'},{n:'cucumber'},{n:'zucchini'}
    ],
    fruits:[
      {n:'berries'},{n:'apple'},{n:'orange'},{n:'banana'},{n:'pear'},{n:'grapes'}
    ]
  }
}
function filterFoods(bank, prefs){
  const diet = (prefs.diet||'none').toLowerCase();
  const restrict = (prefs.restrictions||[]).map(x=>x.toLowerCase());
  function ok(item){
    const tags = item.tags||[];
    if(diet.includes('vegan') && (tags.includes('meat')||tags.includes('fish')||tags.includes('dairy')||tags.includes('egg'))) return false;
    if(diet.includes('vegetarian') && (tags.includes('meat')||tags.includes('fish'))) return false;
    if(diet.includes('pescatarian') && tags.includes('meat')) return false;
    if(diet.includes('lactose') && tags.includes('dairy')) return false;
    if(diet.includes('gluten') && tags.includes('gluten')) return false;
    if(restrict.includes('nuts') && tags.includes('nuts')) return false;
    if(restrict.includes('shellfish') && tags.includes('fish')) return false; // simplistic
    if(restrict.includes('pork') && item.n.includes('pork')) return false;
    return true;
  }
  const out = {};
  for(const k of Object.keys(bank)){
    out[k] = bank[k].filter(ok);
  }
  return out;
}
function buildDietPlan(prefs){
  const {sex='male', age=30, heightCm=170, weightKg=70, activity='light'} = prefs;
  const bmr = calcBMR({sex, age, heightCm, weightKg});
  const cal = targetCalories(Math.round(bmr * activityFactor(activity)), prefs.goal);
  const macros = macroPlan(cal, prefs);
  const bank = filterFoods(foodBank(), prefs);
  const lowGI = item => item.gi==='low' || ['oats','buckwheat','quinoa','legumes','berries','apple'].includes(item.n);

  // Build simple 1-day plan
  function pick(list){ return list[Math.floor(Math.random()*list.length)]?.n }
  const protein = pick(bank.proteins)||'tofu';
  const carb1 = pick(bank.carbs.filter(lowGI)) || pick(bank.carbs) || 'quinoa';
  const carb2 = pick(bank.carbs.filter(lowGI)) || pick(bank.carbs) || 'brown rice';
  const veg1 = pick(bank.veggies)||'broccoli', veg2 = pick(bank.veggies)||'spinach';
  const fat1 = pick(bank.fats)||'olive oil', snack = pick(bank.fruits)||'apple';
  const breakfast = prefs.diet?.includes('low-carb')
    ? `Veg omelette (or tofu scramble) with ${veg1}, side of avocado`
    : `Oats with berries, chia; side ${snack}`;
  const lunch = `${protein} bowl: ${carb1}, ${veg1}+${veg2}, ${fat1}`;
  const dinner = `${protein} + ${carb2} + sautéed ${veg2}`;
  const snacks = prefs.diet?.includes('vegan') ? 'Hummus + veggies; mixed seeds' : 'Greek yogurt (or soy yogurt) with berries';

  const notes = [];
  if((prefs.conditions||[]).some(x=>x.includes('diab'))) notes.push('Focus on low-GI carbs and fiber; distribute carbs evenly across meals.');
  if((prefs.conditions||[]).some(x=>x.includes('hypert'))) notes.push('Limit sodium; favor herbs/spices over salt; follow DASH-style choices.');
  if((prefs.conditions||[]).some(x=>x.includes('kidney'))) notes.push('Monitor potassium/phosphorus; discuss targets with a renal dietitian.');

  return {
    meta:{ name:prefs.name||'You', goal:prefs.goal||'maintain', diet:prefs.diet||'none', activity, sex, age, heightCm, weightKg },
    calories: macros.calories,
    macros,
    plan:{
      breakfast, lunch, dinner, snacks
    },
    grocery:[protein, carb1, carb2, veg1, veg2, fat1, snack].filter(Boolean),
    tips:[
      'Hydration: ~30–35 mL/kg/day unless restricted.',
      'Plate method: 1/2 veggies, 1/4 lean protein, 1/4 smart carbs.',
      'Batch cook for 2–3 days to stay consistent.'
    ].concat(notes)
  }
}
function renderPlan(target, plan){
  target.innerHTML = `
    <div class="card">
      <h3>${plan.meta.name} — ${cap(plan.meta.goal)} • Diet: ${cap(plan.meta.diet)} • Activity: ${cap(plan.meta.activity)}</h3>
      <div class="row">
        <span class="pill">Cal: ${plan.calories} kcal</span>
        <span class="pill">Protein: ${plan.macros.proteinG} g</span>
        <span class="pill">Carbs: ${plan.macros.carbsG} g</span>
        <span class="pill">Fat: ${plan.macros.fatG} g</span>
      </div>
      <div class="hr"></div>
      <div class="grid cols-2">
        <div>
          <b>Breakfast</b><div>${plan.plan.breakfast}</div>
          <div class="hr"></div>
          <b>Lunch</b><div>${plan.plan.lunch}</div>
        </div>
        <div>
          <b>Dinner</b><div>${plan.plan.dinner}</div>
          <div class="hr"></div>
          <b>Snacks</b><div>${plan.plan.snacks}</div>
        </div>
      </div>
      <div class="hr"></div>
      <b>Grocery Ideas</b>
      <div class="row">${plan.grocery.map(i=>`<span class="badge">${i}</span>`).join('')}</div>
      <div class="hr"></div>
      <b>Tips</b>
      <ul>${plan.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
      <div class="muted">This plan is generated by a rules-based demo. For medical conditions, confirm with a clinician.</div>
    </div>
  `;
}

/* ========== Helpers ========== */
function nl2br(s){ return s.replace(/\n/g,'<br>') }
function escapeHtml(s){ return s.replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'}[m])) }

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'health360-demo.json'; a.click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const data = JSON.parse(fr.result);
      if(!data || !Array.isArray(data.patients)) throw new Error('Invalid file');
      state = data; save(state); renderSidebarPatient(); navigate('dashboard');
      alert('Import successful');
    }catch(err){ alert('Import failed: '+err.message) }
  };
  fr.readAsText(file);
});
